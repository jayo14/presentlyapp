services:
  # PostgreSQL Database
  - type: pgsql
    name: presently-db
    databaseName: presently_db
    user: presently_user
    plan: free
    region: oregon

  # Redis for Celery and Caching
  - type: redis
    name: presently-redis
    plan: free
    region: oregon

  # Django Backend Web Service
  - type: web
    name: presently-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: presently.settings
      - key: DATABASE_URL
        fromDatabase:
          name: presently-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: presently-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://presentlyapp.vercel.app"
      - key: FRONTEND_URL
        value: "https://presentlyapp.vercel.app"

  # Celery Worker for Background Tasks
  - type: worker
    name: presently-worker
    runtime: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    dockerCommand: celery -A presently worker --loglevel=info
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: presently-backend
          property: envVar
          envVarKey: SECRET_KEY
      - key: DJANGO_SETTINGS_MODULE
        value: presently.settings
      - key: DATABASE_URL
        fromDatabase:
          name: presently-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: presently-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: presently-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: presently-redis
          property: connectionString