name = "presentlyapp"
main = "worker.mjs"
compatibility_date = "2024-05-22"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./frontend/dist"
binding = "ASSETS"

[build]
command = "[ -d frontend ] && (cd frontend && npx pnpm install && npx pnpm build) || (npx pnpm install && npx pnpm build)"

[observability]
enabled = true
