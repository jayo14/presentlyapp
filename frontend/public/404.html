<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Not Found — Presently</title>
    <script>
      // SPA fallback for static hosts (Cloudflare Pages, Netlify, etc.)
      // Fetch the site's index.html and replace the document so client-side routing can handle the path.
      (function () {
        try {
          fetch('/index.html')
            .then(function (r) { return r.text(); })
            .then(function (html) {
              document.open();
              document.write(html);
              document.close();
              // Keep the requested URL so the SPA router sees it
              history.replaceState({}, '', location.pathname + location.search);
            })
            .catch(function () {
              // Fallback: redirect to root if fetch fails
              location.replace('/');
            });
        } catch (e) {
          location.replace('/');
        }
      })();
    </script>
  </head>
  <body></body>
</html>
