version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: presently_backend
    ports:
      - "8000:8000"
    environment:
      # These environment variables will be available inside the backend container
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-True}
      - REDIS_URL=redis://redis:6379/0
      # Include any other required .env variables here
      # - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  redis:
    image: redis:7-alpine
    container_name: presently_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery_worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: presently_celery_worker
    command: celery -A presently worker -l info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

volumes:
  static_volume:
  media_volume:
  redis_data:
