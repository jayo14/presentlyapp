name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client
  dio: ^5.8.0+1

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^15.1.2

  # Backend / Authentication
  supabase_flutter: ^2.9.1
  google_sign_in: ^6.2.2

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Media & Camera
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # QR codes
  mobile_scanner: ^6.0.4
  qr_flutter: ^4.1.0

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # Network & URLs
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.2

  # Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
