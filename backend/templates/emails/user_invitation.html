<!-- Email: User Invitation -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<title>You're Invited to Presently</title>

<style>
:root {
  --primary: #f2c10d;
  --background-light: #fdfcf7;
  --slate-900: #0f172a;
  --slate-600: #475569;
  --slate-400: #94a3b8;
  --slate-200: #e2e8f0;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Lexend", sans-serif;
  background: var(--background-light);
  -webkit-font-smoothing: antialiased;
}

.wrapper {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.top-bar {
  height: 8px;
  width: 100%;
  background: linear-gradient(135deg, #f2c10d 0%, #D4AF37 100%);
}

.logo-section {
  display: flex;
  justify-content: center;
  padding: 40px 0 24px;
}

.logo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, #f2c10d 0%, #D4AF37 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  box-shadow: 0 20px 25px rgba(242,193,13,0.3);
}

.logo-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--slate-900);
}

.content {
  max-width: 500px;
  margin: 0 auto;
  padding: 16px 24px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 32px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(242,193,13,0.1);
  border: 1px solid rgba(242,193,13,0.1);
}

.card h2 {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 16px;
  color: var(--slate-900);
}

.card p {
  font-size: 16px;
  line-height: 1.6;
  color: var(--slate-600);
  margin-bottom: 24px;
}

.highlight {
  font-weight: 600;
  color: var(--primary);
}

.btn-container {
  margin: 32px 0;
}

.btn {
  background: var(--primary);
  color: var(--slate-900);
  padding: 16px 32px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  display: inline-block;
  box-shadow: 0 10px 15px -3px rgba(242, 193, 13, 0.2);
}

.small-text {
  font-size: 12px;
  color: var(--slate-400);
  word-break: break-all;
}

.divider {
  width: 64px;
  height: 1px;
  background: var(--slate-200);
  margin: 32px auto;
}

.footer {
  text-align: center;
  padding: 40px 20px;
}

.footer p {
  font-size: 12px;
  color: var(--slate-400);
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="top-bar"></div>
  <div class="logo-section">
    <div class="logo-container">
      <img src="https://presentlyapp.vercel.app/logo.png" alt="Presently Logo" style="width: 50px; height: 50px; margin-bottom: 8px;">
      <div style="font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: var(--slate-900);">Presently</div>
    </div>
  </div>
  <div class="content">
    <div class="card" style="box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 1px solid #f1f5f9;">
      <h2 style="margin: 0 0 16px 0; color: var(--slate-900);">You're Invited!</h2>
      <p style="color: var(--slate-600); line-height: 1.6; margin-bottom: 32px;">
        Hello <span class="highlight" style="font-weight: 600; color: #f2c10d;">{{ user_name }}</span>,<br><br>
        <span class="highlight" style="font-weight: 600; color: #f2c10d;">{{ inviter_name }}</span> has invited you to join 
        <strong>{{ institution_name }}</strong> on Presently.
      </p>
      
      <div class="btn-container" style="margin: 32px 0;">
        <a href="{{ invitation_link }}" class="btn" style="background: #f2c10d; color: #000000; padding: 18px 40px; border-radius: 16px; font-weight: 800; text-decoration: none; display: inline-block;">Accept Invitation</a>
      </div>

      <div class="divider" style="height: 1px; background: #f1f5f9; margin: 32px 0;"></div>
      
      <p style="font-size: 14px; color: #64748b; margin-bottom: 8px;">See you on the platform,</p>
      <div style="font-weight: 800; font-size: 18px; color: #f2c10d;">Team Presently</div>
    </div>
  </div>
  <div class="footer">
    <p style="font-weight: 600; color: #64748b; margin-bottom: 4px;">Smart Academic Management</p>
    <p>© 2024 Presently &bull; Sent on behalf of {{ institution_name }}</p>
  </div>
</div>
</body>
</html>
