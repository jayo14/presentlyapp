<!-- Email: Password Reset OTP -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<title>Reset Your Password - Presently</title>

<style>
:root {
  --primary: #f2c10d;
  --background-light: #fdfcf7;
  --slate-900: #0f172a;
  --slate-600: #475569;
  --slate-400: #94a3b8;
  --slate-200: #e2e8f0;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Lexend", sans-serif;
  background: var(--background-light);
  -webkit-font-smoothing: antialiased;
}

.wrapper {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.top-bar {
  height: 8px;
  width: 100%;
  background: linear-gradient(135deg, #f2c10d 0%, #D4AF37 100%);
}

.logo-section {
  display: flex;
  justify-content: center;
  padding: 40px 0 24px;
}

.logo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, #f2c10d 0%, #D4AF37 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  box-shadow: 0 20px 25px rgba(242,193,13,0.3);
}

.logo-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--slate-900);
}

.content {
  max-width: 500px;
  margin: 0 auto;
  padding: 16px 24px;
}

.card {
  background: white;
  border-radius: 24px;
  padding: 32px;
  text-align: center;
  box-shadow: 0 25px 50px rgba(242,193,13,0.1);
  border: 1px solid rgba(242,193,13,0.1);
}

.card h2 {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 16px;
  color: var(--slate-900);
}

.card p {
  font-size: 16px;
  line-height: 1.6;
  color: var(--slate-600);
}

.otp-wrapper {
  margin: 40px 0;
}

.otp-box {
  display: inline-flex;
  padding: 24px 32px;
  border-radius: 16px;
  background: rgba(242,193,13,0.05);
  border: 1px solid rgba(242,193,13,0.2);
}

.otp-code {
  font-size: 48px;
  font-weight: bold;
  letter-spacing: 0.25em;
  font-family: monospace;
  background: linear-gradient(to bottom, #f2c10d, #b38f00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.small-text {
  font-size: 14px;
  color: var(--slate-400);
  margin-bottom: 32px;
}

.divider {
  width: 64px;
  height: 1px;
  background: var(--slate-200);
  margin: 32px auto;
}

.footer {
  text-align: center;
  padding: 40px 20px;
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="top-bar"></div>
  <div class="logo-section">
    <div class="logo-container">
      <div class="logo-icon"><span class="material-symbols-outlined">lock_reset</span></div>
      <div class="logo-title">Presently</div>
    </div>
  </div>
  <div class="content">
    <div class="card">
      <h2>Password Reset</h2>
      <p>
        Use the code below to verify your identity and reset your password.
      </p>

      <div class="otp-wrapper">
        <div class="otp-box">
          <span class="otp-code">{{ otp_code }}</span>
        </div>
      </div>

      <p class="small-text">
        This code will expire in 15 minutes.
      </p>

      <div class="divider"></div>
      <p style="font-size:12px; color:var(--slate-400);">
        If you didn't request a password reset, please secure your account immediately.
      </p>
    </div>
  </div>
  <div class="footer">
    <p>© 2026 Presently Security Team</p>
  </div>
</div>
</body>
</html>
